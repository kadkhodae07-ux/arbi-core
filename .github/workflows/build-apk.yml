name: ArbiCore Private - Build Latest ZIP APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Optional HTTPS backend URL (otherwise Repository Variable ARBICORE_BACKEND_URL is used)"
        required: false
        type: string
      source_zip:
        description: "Optional ZIP path. Leave empty to auto-select the latest committed Flutter ZIP."
        required: false
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.zip"
      - ".github/workflows/arbicore_private_build_apk_FINAL.yml"

concurrency:
  group: arbicore-private-apk-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build latest Flutter ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      FLUTTER_VERSION: "3.32.8"
      JAVA_VERSION: "17"
      LOG_DIR: "${{ github.workspace }}/.ci_logs"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare log directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"

      - name: Select latest valid Flutter ZIP
        id: source
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail

          requested="${REQUESTED_ZIP:-}"
          selected=""

          is_flutter_zip() {
            local zip_file="$1"
            unzip -tq "$zip_file" >/dev/null 2>&1 || return 1
            unzip -Z1 "$zip_file" | grep -Eq '(^|/)pubspec\.yaml$' || return 1
            unzip -Z1 "$zip_file" | grep -Eq '(^|/)lib/main\.dart$' || return 1
          }

          if [[ -n "$requested" ]]; then
            if [[ ! -f "$requested" ]]; then
              echo "::error::Requested ZIP does not exist: $requested"
              exit 1
            fi
            if ! is_flutter_zip "$requested"; then
              echo "::error::Requested ZIP is not a valid Flutter source ZIP: $requested"
              exit 1
            fi
            selected="$requested"
          else
            best_ts=-1
            best_file=""

            while IFS= read -r -d '' file; do
              if ! is_flutter_zip "$file"; then
                continue
              fi

              rel="${file#./}"
              ts="$(git log -1 --format=%ct -- "$rel" 2>/dev/null || true)"
              if [[ -z "$ts" ]]; then
                ts="$(stat -c %Y "$file" 2>/dev/null || echo 0)"
              fi

              if (( ts > best_ts )); then
                best_ts="$ts"
                best_file="$file"
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0)

            if [[ -z "$best_file" ]]; then
              echo "::error::No valid Flutter source ZIP was found in the repository."
              exit 1
            fi
            selected="$best_file"
          fi

          selected="$(realpath "$selected")"
          echo "Selected source ZIP: $selected"
          unzip -tq "$selected"

          extract_dir="$RUNNER_TEMP/arbicore_source_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$selected" -d "$extract_dir"

          app_dir=""
          app_len=999999
          while IFS= read -r -d '' pubspec; do
            dir="$(dirname "$pubspec")"
            if [[ -f "$dir/lib/main.dart" ]]; then
              len=${#dir}
              if (( len < app_len )); then
                app_dir="$dir"
                app_len="$len"
              fi
            fi
          done < <(find "$extract_dir" -type f -name pubspec.yaml -print0)

          if [[ -z "$app_dir" ]]; then
            echo "::error::ZIP was extracted but no Flutter app root (pubspec.yaml + lib/main.dart) was found."
            exit 1
          fi

          echo "Flutter app root: $app_dir"
          echo "source_zip=$selected" >> "$GITHUB_OUTPUT"
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"

          {
            echo "source_zip=$selected"
            echo "app_dir=$app_dir"
          } | tee "$LOG_DIR/00_source_selection.log"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            flutter --version
            dart --version 2>&1
            java -version 2>&1
          } | tee "$LOG_DIR/01_toolchain.log"

      - name: Bootstrap Android project when required
        shell: bash
        working-directory: ${{ steps.source.outputs.app_dir }}
        run: |
          set -euo pipefail

          if [[ -x scripts/bootstrap_android.sh || -f scripts/bootstrap_android.sh ]]; then
            chmod +x scripts/bootstrap_android.sh
            bash scripts/bootstrap_android.sh 2>&1 | tee "$LOG_DIR/02_bootstrap_android.log"
          elif [[ ! -d android ]]; then
            echo "::error::No android/ directory and no scripts/bootstrap_android.sh were found."
            exit 1
          else
            echo "Android project already exists; bootstrap not required." | tee "$LOG_DIR/02_bootstrap_android.log"
          fi

      - name: Resolve Flutter dependencies
        shell: bash
        working-directory: ${{ steps.source.outputs.app_dir }}
        run: |
          set -euo pipefail
          : > "$LOG_DIR/03_pub_get.log"

          status=1
          for attempt in 1 2 3; do
            echo "===== flutter pub get attempt $attempt/3 =====" | tee -a "$LOG_DIR/03_pub_get.log"
            set +e
            flutter pub get 2>&1 | tee -a "$LOG_DIR/03_pub_get.log"
            status=${PIPESTATUS[0]}
            set -e
            if [[ $status -eq 0 ]]; then
              break
            fi
            if [[ $attempt -lt 3 ]]; then
              sleep $((attempt * 8))
            fi
          done

          exit "$status"

      - name: Analyze source
        shell: bash
        working-directory: ${{ steps.source.outputs.app_dir }}
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$LOG_DIR/04_analyze.log"

      - name: Run tests
        shell: bash
        working-directory: ${{ steps.source.outputs.app_dir }}
        run: |
          set -euo pipefail
          if [[ -d test ]] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test 2>&1 | tee "$LOG_DIR/05_tests.log"
          else
            echo "No Flutter tests found; skipping test step." | tee "$LOG_DIR/05_tests.log"
          fi

      - name: Build one release APK
        id: build
        shell: bash
        working-directory: ${{ steps.source.outputs.app_dir }}
        env:
          INPUT_BACKEND_URL: ${{ inputs.backend_url }}
          REPOSITORY_BACKEND_URL: ${{ vars.ARBICORE_BACKEND_URL }}
          API_TOKEN: ${{ secrets.ARBICORE_API_TOKEN }}
          REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set -euo pipefail
          set +x

          backend_url="${INPUT_BACKEND_URL:-}"
          if [[ -z "$backend_url" ]]; then
            backend_url="${REPOSITORY_BACKEND_URL:-}"
          fi

          dart_defines=()
          if [[ -n "$backend_url" ]]; then
            dart_defines+=("--dart-define=BACKEND_URL=$backend_url")
          else
            echo "::warning::No backend URL was supplied. The app will compile with its source default BACKEND_URL."
          fi

          if [[ -n "${API_TOKEN:-}" ]]; then
            dart_defines+=("--dart-define=API_TOKEN=$API_TOKEN")
          else
            echo "::warning::Secret ARBICORE_API_TOKEN is empty."
          fi

          if [[ -n "${REOWN_PROJECT_ID:-}" ]]; then
            dart_defines+=("--dart-define=REOWN_PROJECT_ID=$REOWN_PROJECT_ID")
          else
            echo "::warning::Secret REOWN_PROJECT_ID is empty; wallet connection will remain disabled until configured."
          fi

          rm -rf build/app/outputs/flutter-apk
          : > "$LOG_DIR/06_build_apk.log"

          set +e
          flutter build apk --release "${dart_defines[@]}" 2>&1 | tee "$LOG_DIR/06_build_apk.log"
          status=${PIPESTATUS[0]}
          set -e

          # Retry once only for common transient network/dependency failures.
          if [[ $status -ne 0 ]] && grep -Eqi \
            'timed out|timeout|connection reset|connection refused|temporary failure|could not resolve|could not download|socketexception|http[^0-9]*(502|503|504)|remote host terminated' \
            "$LOG_DIR/06_build_apk.log"; then
            echo "Transient network/dependency failure detected; retrying build once." | tee -a "$LOG_DIR/06_build_apk.log"
            sleep 10
            set +e
            flutter pub get 2>&1 | tee -a "$LOG_DIR/06_build_apk.log"
            flutter build apk --release "${dart_defines[@]}" 2>&1 | tee -a "$LOG_DIR/06_build_apk.log"
            status=${PIPESTATUS[0]}
            set -e
          fi

          exit "$status"

      - name: Verify and stage exactly one APK
        id: apk
        shell: bash
        working-directory: ${{ steps.source.outputs.app_dir }}
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [[ ! -s "$apk" ]]; then
            echo "::error::Expected release APK was not created: $apk"
            find build/app/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          delivery="$GITHUB_WORKSPACE/delivery"
          rm -rf "$delivery"
          mkdir -p "$delivery"
          final_apk="$delivery/ArbiCore-Private.apk"
          cp "$apk" "$final_apk"

          # APK is a ZIP container; this catches truncated/corrupt output.
          unzip -tq "$final_apk" >/dev/null

          count="$(find "$delivery" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          if [[ "$count" != "1" ]]; then
            echo "::error::Delivery directory must contain exactly one APK; found $count."
            find "$delivery" -maxdepth 1 -type f -print
            exit 1
          fi

          sha="$(sha256sum "$final_apk" | awk '{print $1}')"
          size="$(stat -c %s "$final_apk")"
          echo "apk_path=$final_apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

          {
            echo "### ArbiCore APK build"
            echo "- Source ZIP: \`${{ steps.source.outputs.source_zip }}\`"
            echo "- APK: \`ArbiCore-Private.apk\`"
            echo "- Size: \`$size bytes\`"
            echo "- SHA-256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only the final APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: ArbiCore-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Delete all previous ArbiCore outputs after successful upload
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.upload_apk.outputs.artifact-id }}
        run: |
          set -u

          if [[ -z "${CURRENT_ARTIFACT_ID:-}" ]]; then
            echo "::warning::Current artifact ID is unavailable; old artifacts were not deleted."
            exit 0
          fi

          echo "Keeping current artifact ID: $CURRENT_ARTIFACT_ID"
          failures=0

          mapfile -t old_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select((.name | startswith(\"ArbiCore-\")) and (.id != ($CURRENT_ARTIFACT_ID | tonumber))) | .id" \
              2>/dev/null || true
          )

          for artifact_id in "${old_ids[@]}"; do
            [[ -z "$artifact_id" ]] && continue
            deleted=0
            for attempt in 1 2 3; do
              if gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" >/dev/null 2>&1; then
                echo "Deleted previous artifact: $artifact_id"
                deleted=1
                break
              fi
              sleep $((attempt * 3))
            done
            if [[ $deleted -ne 1 ]]; then
              echo "::warning::Could not delete previous artifact $artifact_id after 3 attempts."
              failures=$((failures + 1))
            fi
          done

          if [[ $failures -eq 0 ]]; then
            echo "Previous ArbiCore artifacts cleaned successfully."
          else
            echo "::warning::$failures previous artifact(s) could not be deleted. APK build remains successful."
          fi

      - name: Collect failure diagnostics
        if: failure()
        id: diagnostics
        shell: bash
        env:
          API_TOKEN_TO_REDACT: ${{ secrets.ARBICORE_API_TOKEN }}
          REOWN_ID_TO_REDACT: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          set +e

          diag_root="$GITHUB_WORKSPACE/.diagnostics"
          diag_dir="$diag_root/report"
          diag_zip="$diag_root/ArbiCore-build-error-run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}.zip"
          rm -rf "$diag_root"
          mkdir -p "$diag_dir"

          if [[ -d "$LOG_DIR" ]]; then
            cp -R "$LOG_DIR" "$diag_dir/logs"
          fi

          {
            echo "ArbiCore Private build diagnostics"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "source_zip=${{ steps.source.outputs.source_zip }}"
            echo "app_dir=${{ steps.source.outputs.app_dir }}"
          } > "$diag_dir/context.txt"

          {
            uname -a
            echo
            df -h
            echo
            free -h || true
            echo
            command -v flutter && flutter --version || true
            echo
            command -v dart && dart --version 2>&1 || true
            echo
            java -version 2>&1 || true
            echo
            git --version || true
          } > "$diag_dir/system.txt" 2>&1

          app_dir="${{ steps.source.outputs.app_dir }}"
          if [[ -n "$app_dir" && -d "$app_dir" ]]; then
            [[ -f "$app_dir/pubspec.yaml" ]] && cp "$app_dir/pubspec.yaml" "$diag_dir/pubspec.yaml"
            [[ -f "$app_dir/pubspec.lock" ]] && cp "$app_dir/pubspec.lock" "$diag_dir/pubspec.lock"
            [[ -f "$app_dir/android/gradle/wrapper/gradle-wrapper.properties" ]] && \
              cp "$app_dir/android/gradle/wrapper/gradle-wrapper.properties" "$diag_dir/gradle-wrapper.properties"
            [[ -f "$app_dir/android/settings.gradle" ]] && cp "$app_dir/android/settings.gradle" "$diag_dir/settings.gradle"
            [[ -f "$app_dir/android/settings.gradle.kts" ]] && cp "$app_dir/android/settings.gradle.kts" "$diag_dir/settings.gradle.kts"
            [[ -f "$app_dir/android/app/build.gradle" ]] && cp "$app_dir/android/app/build.gradle" "$diag_dir/app-build.gradle"
            [[ -f "$app_dir/android/app/build.gradle.kts" ]] && cp "$app_dir/android/app/build.gradle.kts" "$diag_dir/app-build.gradle.kts"

            find "$app_dir/build" -type f \
              \( -name '*.log' -o -name '*.txt' -o -name '*.html' \) \
              -size -5M -print 2>/dev/null | head -50 > "$diag_dir/build-report-files.txt" || true
          fi

          [[ -f "$HOME/.pub-cache/log/pub_log.txt" ]] && cp "$HOME/.pub-cache/log/pub_log.txt" "$diag_dir/pub_log.txt"

          # Redact configured values if they appeared in any text log.
          python3 - "$diag_dir" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          secrets = [
              os.environ.get("API_TOKEN_TO_REDACT", ""),
              os.environ.get("REOWN_ID_TO_REDACT", ""),
          ]
          secrets = [s for s in secrets if s]
          if secrets:
              for path in root.rglob("*"):
                  if not path.is_file() or path.stat().st_size > 10_000_000:
                      continue
                  try:
                      text = path.read_text(errors="ignore")
                  except Exception:
                      continue
                  updated = text
                  for secret in secrets:
                      updated = updated.replace(secret, "***REDACTED***")
                  if updated != text:
                      path.write_text(updated)
          PY

          (cd "$diag_root" && zip -qr "$(basename "$diag_zip")" report)
          echo "diag_zip=$diag_zip" >> "$GITHUB_OUTPUT"
          echo "Failure diagnostics created: $diag_zip"

      - name: Upload error log package
        if: failure() && steps.diagnostics.outputs.diag_zip != ''
        uses: actions/upload-artifact@v4
        with:
          name: ArbiCore-Build-Error-${{ github.run_number }}-Attempt-${{ github.run_attempt }}
          path: ${{ steps.diagnostics.outputs.diag_zip }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
